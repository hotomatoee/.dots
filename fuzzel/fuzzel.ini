[main]
font = monospace:size=10
lines = 1
prompt = 
icons-enabled = no
width = 100
horizontal-pad = 0
vertical-pad = 0
inner-pad = 0
line-height = 18
layer = overlay
anchor = bottom
fields = name,exec
exit-on-keyboard-focus-loss = yes
horizontal-offset = 18
vertical-offset = 0
border-radius = 0
border-width = 0
dpi-aware = no
match-mode = normal
wrap = yes
show-actions = no
horizontal = yes

[colors]
background = 000000cc
text = ffffff
selection = ffffff
selection-text = 000000
border = 000000

