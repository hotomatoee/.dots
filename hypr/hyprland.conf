################
### MONITORS ###
################
monitor = DP-1,2560x1440@180,auto,1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nnn
$menu = bemenu-run -i --bottom -p ":" --single-instance -C -w --auto-select --border 1 --bdr "#1c171caa" -R 6 -H 18 -M 5 --hp 40 --tb "#00000000" --tf "#c7c7c7" --fb "#141114cc" --ff "#e0e0e0" --nb "#141114cc" --nf "#a8a8a8" --hb "#c7c7c722" --hf "#ffffff" --cb "#c7c7c744" --cf "#ffffff" --sb "#c7c7c722" --sf "#ffffff" --scb "#00000000" --scf "#c7c7c744"
#################
### AUTOSTART ###
#################
exec-once = mako
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hyprpaper
exec-once = quickshell

############################
### ENVIRONMENT VARIABLES ##
############################
env = XCURSOR_THEME,Bibata-Original-Classic
env = XCURSOR_SIZE,18

####################
### LOOK AND FEEL ##
####################
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(C7C7C7C7)
    col.inactive_border = rgba(1c171caa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 0.82
    inactive_opacity = 0.82

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(000000ee)
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        vibrancy = 0.12
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        popups = true
        xray = true
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 3, default
    animation = border, 1, 1, easeOutQuint
    animation = windows, 1, 1, easeOutQuint
    animation = fadeIn, 1, 1, quick
    animation = fadeOut, 1, 1, quick
    animation = workspaces, 1, 1, easeOutQuint, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = , PRINT, exec, hyprshot -m region --clipboard only
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, space, exec, $menu
bind = $mainMod, J, togglesplit
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, A, movefocus, l
bind = $mainMod, R, movefocus, u
bind = $mainMod, S, movefocus, d
bind = $mainMod, T, movefocus, r

bind = $mainMod, N, movewindow, l
bind = $mainMod, E, movewindow, u
bind = $mainMod, I, movewindow, d
bind = $mainMod, O, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

