general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
}

background {
    color = rgb(15,16,16) # #0f1010
}

input-field {
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 1
    rounding = 0

    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    font_color = rgb(213,196,161)   # #d5c4a1
    inner_color = rgb(15,16,16)      # #0f1010
    outer_color = rgb(104,157,106)   # #689d6a (dark aqua)
    check_color = rgb(104,157,106)   # dark aqua
    fail_color = rgb(204,36,29)      # #cc241d

    fade_on_empty = false
    placeholder_text = -
}

